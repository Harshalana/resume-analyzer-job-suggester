[project]
name = "resume-analyzer-job-suggester"
version = "1.0.0"
description = "CareerCraft AI - Intelligent Resume Analyzer and Job Suggester"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

